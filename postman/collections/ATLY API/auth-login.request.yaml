$kind: http-request
name: Login
method: POST
url: "{{baseUrl}}/api/v1/auth/login"
order: 2000
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "email": "teste1@example.com",
      "senha": "123456"
    }
tests:
  - script: |-
      if (pm.response.code === 200) {
        const data = pm.response.json();
        pm.environment.set('token', data.accessToken);
      }
