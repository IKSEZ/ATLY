$kind: http-request
name: 'Criar atleta'
method: POST
url: '{{baseUrl}}/api/v1/atletas'
order: 6000
headers:
  - key: Authorization
    value: 'Bearer {{token}}'
  - key: Content-Type
    value: 'application/json'
body:
  type: json
  content: |-
    {
      "nome": "Atleta Exemplo",
      "email": "atleta@example.com",
      "senha": "123456",
      "idade": 22,
      "peso": 75,
      "altura": 180
    }
