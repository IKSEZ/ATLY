$kind: http-request
name: 'Atualizar atleta'
method: PUT
url: '{{baseUrl}}/api/v1/atletas/:id'
order: 7000
headers:
  - key: Authorization
    value: 'Bearer {{token}}'
  - key: Content-Type
    value: 'application/json'
pathVariables:
  - key: id
    value: '{{atletaId}}'
body:
  type: json
  content: |-
    {
      "peso": 76,
      "altura": 181
    }
